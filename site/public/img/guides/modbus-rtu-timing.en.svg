<rect x="30" y="80" width="49.71641791044776" height="44" rx="3" fill="#eef0f3" stroke="#8a96a3" stroke-width="1.5"/><text x="55.85820895522388" y="100" text-anchor="middle" font-size="12" font-weight="600">t3.5</text><text x="55.85820895522388" y="116" text-anchor="middle" font-size="11" fill="#5a6572" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">4.0 ms</text><rect x="81.71641791044776" y="80" width="116.20895522388061" height="44" rx="3" fill="#e0ecff" stroke="#8a96a3" stroke-width="1.5"/><text x="140.82089552238807" y="100" text-anchor="middle" font-size="12" font-weight="600">request 8 B</text><text x="140.82089552238807" y="116" text-anchor="middle" font-size="11" fill="#5a6572" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">9.2 ms</text><rect x="199.92537313432837" y="80" width="126.95522388059703" height="44" rx="3" fill="#fff7e6" stroke="#8a96a3" stroke-width="1.5"/><text x="264.4029850746269" y="100" text-anchor="middle" font-size="12" font-weight="600">slave processing</text><text x="264.4029850746269" y="116" text-anchor="middle" font-size="11" fill="#5a6572" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">10.0 ms</text><rect x="328.8805970149254" y="80" width="367.4029850746269" height="44" rx="3" fill="#e3f4e8" stroke="#8a96a3" stroke-width="1.5"/><text x="513.5820895522388" y="100" text-anchor="middle" font-size="12" font-weight="600">response 25 B</text><text x="513.5820895522388" y="116" text-anchor="middle" font-size="11" fill="#5a6572" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">28.6 ms</text><rect x="698.2835820895523" y="80" width="49.71641791044776" height="44" rx="3" fill="#eef0f3" stroke="#8a96a3" stroke-width="1.5"/><text x="724.1417910447761" y="100" text-anchor="middle" font-size="12" font-weight="600">t3.5</text><text x="724.1417910447761" y="116" text-anchor="middle" font-size="11" fill="#5a6572" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">4.0 ms</text><text x="30" y="40" font-size="13" font-weight="600" fill="#1d4ed8">Master</text><path d="M81.71641791044776 50 V74" stroke="#1d4ed8" stroke-width="1.5" fill="none" stroke-linejoin="round"/><text x="87.71641791044776" y="62" font-size="12" fill="#1d4ed8">sends request</text><text x="328.8805970149254" y="40" font-size="13" font-weight="600" fill="#15803d">Slave</text><path d="M328.8805970149254 50 V74" stroke="#15803d" stroke-width="1.5" fill="none" stroke-linejoin="round"/><text x="334.8805970149254" y="62" font-size="12" fill="#15803d">sends response</text><path d="M199.92537313432837 136 V142 H696.2835820895523 V136" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linejoin="round"/><text x="449.1044776119403" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">the response timeout must be longer than this</text><text x="30" y="210" font-size="12" fill="#5a6572">10 ms slave processing is an example — real devices differ</text>
