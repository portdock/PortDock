<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>Segments of one CAN bit (16 TQ, 87.5 % sample point)</title>
<rect width="780" height="250" rx="10" fill="#fff"/>
<rect x="40" y="70" width="43" height="44" rx="0" fill="#e5e7eb" stroke="#8a96a3" stroke-width="1"/><text x="61.5" y="60" text-anchor="middle" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">SYNC</text><text x="61.5" y="97" text-anchor="middle" font-size="12">1 TQ</text><rect x="83" y="70" width="43" height="44" rx="0" fill="#dbeafe" stroke="#8a96a3" stroke-width="1"/><rect x="126" y="70" width="43" height="44" rx="0" fill="#dbeafe" stroke="#8a96a3" stroke-width="1"/><rect x="169" y="70" width="43" height="44" rx="0" fill="#dbeafe" stroke="#8a96a3" stroke-width="1"/><rect x="212" y="70" width="43" height="44" rx="0" fill="#dbeafe" stroke="#8a96a3" stroke-width="1"/><rect x="255" y="70" width="43" height="44" rx="0" fill="#dbeafe" stroke="#8a96a3" stroke-width="1"/><text x="190.5" y="60" text-anchor="middle" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">PROP_SEG</text><text x="190.5" y="97" text-anchor="middle" font-size="12">5 TQ</text><rect x="298" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><rect x="341" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><rect x="384" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><rect x="427" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><rect x="470" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><rect x="513" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><rect x="556" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><rect x="599" y="70" width="43" height="44" rx="0" fill="#dcfce7" stroke="#8a96a3" stroke-width="1"/><text x="470" y="60" text-anchor="middle" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">PHASE_SEG1</text><text x="470" y="97" text-anchor="middle" font-size="12">8 TQ</text><rect x="642" y="70" width="43" height="44" rx="0" fill="#fee2e2" stroke="#8a96a3" stroke-width="1"/><rect x="685" y="70" width="43" height="44" rx="0" fill="#fee2e2" stroke="#8a96a3" stroke-width="1"/><text x="685" y="60" text-anchor="middle" font-size="12" font-weight="600" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">PHASE_SEG2</text><text x="685" y="97" text-anchor="middle" font-size="12">2 TQ</text><line x1="642" y1="44" x2="642" y2="130" stroke="#b91c1c" stroke-width="2.5"/><text x="642" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">Sample point = (1 + 5 + 8) ÷ 16 = 87.5 %</text><line x1="40" y1="166" x2="728" y2="166" stroke="#5a6572" stroke-width="1.5"/><line x1="40" y1="160" x2="40" y2="172" stroke="#5a6572" stroke-width="1.5"/><line x1="728" y1="160" x2="728" y2="172" stroke="#5a6572" stroke-width="1.5"/><text x="384" y="186" text-anchor="middle" font-size="13">Bit time = 16 TQ (8 MHz ÷ prescaler 4 → TQ 500 ns → 8 µs = 125 kbit/s)</text><text x="40" y="236" font-size="12" fill="#5a6572">PHASE_SEG2 is at least 2 TQ (IPT). Resync lengthens PHASE_SEG1 or shortens PHASE_SEG2 by up to SJW.</text>
</svg>
