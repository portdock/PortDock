<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>Thermocouple cold-junction compensation (type K at 300 °C, terminals at 25 °C)</title>
<rect width="780" height="320" rx="10" fill="#fff"/>
<path d="M70 120 L110 95 H430" stroke="#c2410c" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M70 120 L110 145 H430" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linejoin="round"/><circle cx="70" cy="120" r="6" fill="#1f2933"/><text x="70" y="75" text-anchor="middle" font-size="16" font-weight="600" fill="#b91c1c">300 °C</text><text x="70" y="175" text-anchor="middle" font-size="12" fill="#5a6572">Measuring</text><text x="70" y="191" text-anchor="middle" font-size="12" fill="#5a6572">(hot) junction</text><text x="150" y="87" font-size="13" font-weight="600" fill="#c2410c">+ (K)</text><text x="150" y="165" font-size="13" font-weight="600" fill="#1d4ed8">− (K)</text><text x="270" y="125" text-anchor="middle" font-size="12" fill="#5a6572">Extension cable (same type)</text><rect x="400" y="55" width="90" height="140" rx="6" fill="#fff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="440" cy="95" r="8" fill="#fff" stroke="#1f2933" stroke-width="2"/><circle cx="440" cy="145" r="8" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="445" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Cold junction = input terminals</text><text x="445" y="215" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">25 °C</text><path d="M448 95 H560" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M448 145 H560" stroke="#4b5563" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="560" y="55" width="200" height="140" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="660" y="82" text-anchor="middle" font-size="15" font-weight="600">Input device</text><text x="660" y="120" text-anchor="middle" font-size="13" fill="#5a6572">Voltage at the terminals</text><text x="660" y="145" text-anchor="middle" font-size="17" font-weight="600" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">11.208 mV</text><rect x="20" y="240" width="360" height="66" rx="6" fill="#ecf8f0" stroke="#15803d" stroke-width="1.5"/><circle cx="42" cy="262" r="10" fill="#15803d"/><path d="M37 262 L41 266 L47 258" stroke="#fff" stroke-width="2.5" fill="none" stroke-linejoin="round"/><text x="60" y="267" font-size="13" font-weight="600">CJC on</text><text x="60" y="290" font-size="13">adds the 25 °C share → 300 °C</text><rect x="400" y="240" width="360" height="66" rx="6" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.5"/><circle cx="422" cy="262" r="10" fill="#b91c1c"/><path d="M418 258 L426 266 M426 258 L418 266" stroke="#fff" stroke-width="2.5" fill="none" stroke-linejoin="round"/><text x="440" y="267" font-size="13" font-weight="600">No CJC</text><text x="440" y="290" font-size="13">read as if 0 °C → about 275.8 °C</text>
</svg>
