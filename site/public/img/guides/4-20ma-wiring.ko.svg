<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 535" width="780" height="535" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>4–20 mA 2선식과 4선식 결선</title>
<rect width="780" height="535" rx="10" fill="#fff"/>
<text x="20" y="35" font-size="16" font-weight="600">2선식 (루프 전원)</text><rect x="40" y="90" width="120" height="120" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="100" y="145" text-anchor="middle" font-size="14" font-weight="600">루프 전원</text><text x="100" y="165" text-anchor="middle" font-size="13" fill="#5a6572">DC</text><text x="148" y="114" font-size="15" font-weight="600">+</text><text x="148" y="200" font-size="15" font-weight="600">−</text><rect x="320" y="80" width="150" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="395" y="115" text-anchor="middle" font-size="15" font-weight="600">전송기</text><text x="395" y="135" text-anchor="middle" font-size="12" fill="#5a6572">2선식 · 전원 = 신호선</text><text x="328" y="114" font-size="14" font-weight="600">+</text><text x="462" y="114" text-anchor="end" font-size="14" font-weight="600">−</text><path d="M160 110 H320" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M470 110 H530 V120 H600" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M600 195 H160" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M241 104 L250 110 L241 116 Z" fill="#c2410c"/><text x="240" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">4–20 mA</text><path d="M389 189 L380 195 L389 201 Z" fill="#c2410c"/><rect x="600" y="55" width="160" height="160" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="680" y="78" text-anchor="middle" font-size="15" font-weight="600">입력</text><text x="680" y="98" text-anchor="middle" font-size="12" fill="#5a6572">전류만 재는 입력</text><text x="608" y="110" font-size="15" font-weight="600">+</text><text x="608" y="196" font-size="15" font-weight="600">−</text><path d="M600 120 H640" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/><line x1="640" y1="120" x2="640" y2="142.5" stroke="#1f2933" stroke-width="2"/><line x1="640" y1="172.5" x2="640" y2="195" stroke="#1f2933" stroke-width="2"/><rect x="634" y="142.5" width="12" height="30" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><path d="M640 195 H600" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="652" y="155" font-size="13" font-weight="600">250 Ω</text><text x="652" y="175" font-size="13" font-weight="600" fill="#1d4ed8">1–5 V</text><text x="20" y="235" font-size="13" fill="#5a6572">두 선이 전원이자 신호 — 루프 어딘가에 전원이 하나 있어야 합니다.</text><text x="20" y="253" font-size="13" fill="#5a6572">250 Ω 에서 4 mA → 1 V, 20 mA → 5 V.</text><text x="20" y="300" font-size="16" font-weight="600">4선식 (능동 출력)</text><rect x="40" y="355" width="120" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="100" y="400" text-anchor="middle" font-size="14" font-weight="600">전원</text><rect x="300" y="335" width="170" height="130" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="385" y="395" text-anchor="middle" font-size="15" font-weight="600">전송기</text><text x="385" y="415" text-anchor="middle" font-size="12" fill="#5a6572">따로 전원 · 전류를 스스로 냄</text><path d="M160 370 H300" stroke="#4b5563" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M160 420 H300" stroke="#4b5563" stroke-width="2.5" fill="none" stroke-linejoin="round"/><text x="230" y="400" text-anchor="middle" font-size="12" fill="#5a6572" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">PWR</text><text x="462" y="389" text-anchor="end" font-size="14" font-weight="600">+</text><text x="462" y="459" text-anchor="end" font-size="14" font-weight="600">−</text><path d="M470 385 H600" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M470 455 V460 H600" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M531 379 L540 385 L531 391 Z" fill="#c2410c"/><text x="530" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">4–20 mA</text><rect x="600" y="320" width="160" height="160" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="680" y="343" text-anchor="middle" font-size="15" font-weight="600">입력</text><text x="680" y="363" text-anchor="middle" font-size="12" fill="#5a6572">전류만 재는 입력</text><text x="608" y="375" font-size="15" font-weight="600">+</text><text x="608" y="461" font-size="15" font-weight="600">−</text><path d="M600 385 H640" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/><line x1="640" y1="385" x2="640" y2="407.5" stroke="#1f2933" stroke-width="2"/><line x1="640" y1="437.5" x2="640" y2="460" stroke="#1f2933" stroke-width="2"/><rect x="634" y="407.5" width="12" height="30" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><path d="M640 460 H600" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="652" y="420" font-size="13" font-weight="600">250 Ω</text><text x="652" y="440" font-size="13" font-weight="600" fill="#1d4ed8">1–5 V</text><text x="20" y="500" font-size="13" fill="#5a6572">전송기가 전류를 스스로 내므로 받는 쪽은 루프 전원을 대지 않는 입력이어야 합니다.</text><text x="20" y="518" font-size="13" fill="#5a6572">전원을 대는 입력에 물리면 루프에 전원이 둘이 됩니다.</text>
</svg>
