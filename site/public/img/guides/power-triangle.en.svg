<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>Power triangle and power factor correction (100 kW, cos φ 0.75 → 0.95)</title>
<rect width="780" height="330" rx="10" fill="#fff"/>
<line x1="60" y1="290" x2="310" y2="290" stroke="#1f2933" stroke-width="3"/><text x="185" y="312" text-anchor="middle" font-size="13" font-weight="600">Real power P = 100 kW</text><line x1="60" y1="290" x2="310" y2="69.525" stroke="#b91c1c" stroke-width="2.5"/><line x1="310" y1="290" x2="310" y2="69.525" stroke="#b91c1c" stroke-width="2.5"/><line x1="60" y1="290" x2="310" y2="207.825" stroke="#15803d" stroke-width="3"/><line x1="310" y1="290" x2="310" y2="207.825" stroke="#15803d" stroke-width="3"/><path d="M320 69.525 H330 V207.825 H320" stroke="#1d4ed8" stroke-width="1.5" fill="none" stroke-linejoin="round"/><text x="338" y="143.675" font-size="13" font-weight="600" fill="#1d4ed8">Capacitor Qc 55.3 kvar</text><text x="338" y="74.525" font-size="12" fill="#b91c1c">Q 88.2 kvar</text><text x="338" y="253.9125" font-size="12" fill="#15803d">Q 32.9 kvar</text><line x1="520" y1="150" x2="556" y2="150" stroke="#b91c1c" stroke-width="2.5"/><text x="564" y="155" font-size="13" font-weight="600" fill="#b91c1c">Before S 133.3 kVA</text><line x1="520" y1="180" x2="556" y2="180" stroke="#15803d" stroke-width="3"/><text x="564" y="185" font-size="13" font-weight="600" fill="#15803d">After S 105.3 kVA</text><text x="20" y="30" font-size="14" font-weight="600">Capacitors reduce only the reactive power Q; the real power P stays</text><text x="20" y="52" font-size="12" fill="#5a6572">Apparent power S = √(P² + Q²) falls, so the same work takes less current</text>
</svg>
