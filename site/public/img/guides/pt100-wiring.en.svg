<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>Pt100 two-, three- and four-wire connections</title>
<rect width="780" height="330" rx="10" fill="#fff"/>
<rect x="10" y="10" width="244" height="310" rx="8" fill="#fff" stroke="#dde2e7" stroke-width="1.5"/><text x="26" y="38" font-size="16" font-weight="600">2-wire</text><line x1="50" y1="105" x2="50" y2="135" stroke="#c2410c" stroke-width="2"/><line x1="50" y1="165" x2="50" y2="195" stroke="#c2410c" stroke-width="2"/><rect x="44" y="135" width="12" height="30" rx="1" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="42" y="154" text-anchor="end" font-size="11" font-weight="600" fill="#c2410c">Pt100</text><text x="62" y="154" font-size="12" font-weight="600" fill="#c2410c" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">Rt</text><rect x="180" y="60" width="60" height="180" rx="4" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="210" y="80" text-anchor="middle" font-size="12" font-weight="600">Input</text><line x1="50" y1="105" x2="102" y2="105" stroke="#1f2933" stroke-width="2"/><line x1="128" y1="105" x2="180" y2="105" stroke="#1f2933" stroke-width="2"/><rect x="102" y="99" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="50" y1="195" x2="102" y2="195" stroke="#1f2933" stroke-width="2"/><line x1="128" y1="195" x2="180" y2="195" stroke="#1f2933" stroke-width="2"/><rect x="102" y="189" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="115" y="94" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><text x="115" y="184" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><circle cx="210" cy="150" r="16" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="210" y="155" text-anchor="middle" font-size="15" font-weight="600">Ω</text><text x="132" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">R = Rt + 2·RL</text><text x="132" y="296" text-anchor="middle" font-size="12" fill="#5a6572">Lead resistance adds in,</text><text x="132" y="312" text-anchor="middle" font-size="12" fill="#5a6572">reads high (1 Ω ≈ 2.6 °C)</text><rect x="268" y="10" width="244" height="310" rx="8" fill="#fff" stroke="#dde2e7" stroke-width="1.5"/><text x="284" y="38" font-size="16" font-weight="600">3-wire</text><line x1="308" y1="105" x2="308" y2="135" stroke="#c2410c" stroke-width="2"/><line x1="308" y1="165" x2="308" y2="195" stroke="#c2410c" stroke-width="2"/><rect x="302" y="135" width="12" height="30" rx="1" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="300" y="154" text-anchor="end" font-size="11" font-weight="600" fill="#c2410c">Pt100</text><text x="320" y="154" font-size="12" font-weight="600" fill="#c2410c" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">Rt</text><rect x="438" y="60" width="60" height="180" rx="4" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="12" font-weight="600">Input</text><line x1="308" y1="105" x2="360" y2="105" stroke="#1f2933" stroke-width="2"/><line x1="386" y1="105" x2="438" y2="105" stroke="#1f2933" stroke-width="2"/><rect x="360" y="99" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="308" y1="195" x2="360" y2="195" stroke="#1f2933" stroke-width="2"/><line x1="386" y1="195" x2="438" y2="195" stroke="#1f2933" stroke-width="2"/><rect x="360" y="189" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><path d="M308 195 V225" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/><line x1="308" y1="225" x2="360" y2="225" stroke="#1f2933" stroke-width="2"/><line x1="386" y1="225" x2="438" y2="225" stroke="#1f2933" stroke-width="2"/><rect x="360" y="219" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><circle cx="308" cy="195" r="3.5" fill="#1f2933"/><text x="373" y="94" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><text x="373" y="184" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><text x="373" y="214" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><circle cx="468" cy="150" r="16" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="468" y="155" text-anchor="middle" font-size="15" font-weight="600">Ω</text><text x="390" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">RL1 = RL2 = RL3 → R = Rt</text><text x="390" y="296" text-anchor="middle" font-size="12" fill="#5a6572">Third wire measures and</text><text x="390" y="312" text-anchor="middle" font-size="12" fill="#5a6572">subtracts lead resistance if equal</text><rect x="526" y="10" width="244" height="310" rx="8" fill="#fff" stroke="#dde2e7" stroke-width="1.5"/><text x="542" y="38" font-size="16" font-weight="600">4-wire</text><line x1="566" y1="125" x2="566" y2="140" stroke="#c2410c" stroke-width="2"/><line x1="566" y1="170" x2="566" y2="185" stroke="#c2410c" stroke-width="2"/><rect x="560" y="140" width="12" height="30" rx="1" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="558" y="154" text-anchor="end" font-size="11" font-weight="600" fill="#c2410c">Pt100</text><text x="578" y="154" font-size="12" font-weight="600" fill="#c2410c" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">Rt</text><rect x="696" y="60" width="60" height="180" rx="4" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="726" y="80" text-anchor="middle" font-size="12" font-weight="600">Input</text><path d="M566 125 V95" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="566" cy="125" r="3.5" fill="#1f2933"/><line x1="566" y1="95" x2="618" y2="95" stroke="#1f2933" stroke-width="2"/><line x1="644" y1="95" x2="696" y2="95" stroke="#1f2933" stroke-width="2"/><rect x="618" y="89" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="566" y1="125" x2="618" y2="125" stroke="#1f2933" stroke-width="2"/><line x1="644" y1="125" x2="696" y2="125" stroke="#1f2933" stroke-width="2"/><rect x="618" y="119" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><path d="M566 185 V215" stroke="#1f2933" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="566" cy="185" r="3.5" fill="#1f2933"/><line x1="566" y1="185" x2="618" y2="185" stroke="#1f2933" stroke-width="2"/><line x1="644" y1="185" x2="696" y2="185" stroke="#1f2933" stroke-width="2"/><rect x="618" y="179" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="566" y1="215" x2="618" y2="215" stroke="#1f2933" stroke-width="2"/><line x1="644" y1="215" x2="696" y2="215" stroke="#1f2933" stroke-width="2"/><rect x="618" y="209" width="26" height="12" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="631" y="84" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><text x="631" y="114" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><text x="631" y="174" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><text x="631" y="204" text-anchor="middle" font-size="11" fill="#5a6572">RL</text><text x="704" y="99" font-size="11" font-weight="600" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">I+</text><text x="704" y="129" font-size="11" font-weight="600" fill="#1d4ed8" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">V+</text><text x="704" y="189" font-size="11" font-weight="600" fill="#1d4ed8" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">V−</text><text x="704" y="219" font-size="11" font-weight="600" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">I−</text><text x="648" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">I(V±) ≈ 0 → R = Rt</text><text x="648" y="296" text-anchor="middle" font-size="12" fill="#5a6572">Separate current and sense</text><text x="648" y="312" text-anchor="middle" font-size="12" fill="#5a6572">wires: leads negligible</text>
</svg>
