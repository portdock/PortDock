<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>Motor current chain (three-phase 7.5 kW, 380 V)</title>
<rect width="780" height="250" rx="10" fill="#fff"/>
<rect x="20" y="70" width="120" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="80" y="100" text-anchor="middle" font-size="13" font-weight="600">Output (shaft)</text><text x="80" y="132" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">7.5 kW</text><line x1="146" y1="110" x2="218.66666666666669" y2="110" stroke="#1d4ed8" stroke-width="2"/><path d="M211.66666666666669 104 L220.66666666666669 110 L211.66666666666669 116 Z" fill="#1d4ed8"/><text x="183.33333333333334" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">÷ η 0.9</text><rect x="226.66666666666669" y="70" width="120" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="286.6666666666667" y="100" text-anchor="middle" font-size="13" font-weight="600">Input power</text><text x="286.6666666666667" y="132" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">8.33 kW</text><line x1="352.6666666666667" y1="110" x2="425.33333333333337" y2="110" stroke="#1d4ed8" stroke-width="2"/><path d="M418.33333333333337 104 L427.33333333333337 110 L418.33333333333337 116 Z" fill="#1d4ed8"/><text x="390" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">÷ cos φ 0.85</text><rect x="433.33333333333337" y="70" width="120" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="493.33333333333337" y="100" text-anchor="middle" font-size="13" font-weight="600">Apparent power</text><text x="493.33333333333337" y="132" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">9.80 kVA</text><line x1="559.3333333333334" y1="110" x2="632" y2="110" stroke="#1d4ed8" stroke-width="2"/><path d="M625 104 L634 110 L625 116 Z" fill="#1d4ed8"/><text x="596.6666666666667" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">÷ √3·380 V</text><rect x="640" y="70" width="120" height="80" rx="6" fill="#ecf8f0" stroke="#15803d" stroke-width="1.5"/><text x="700" y="100" text-anchor="middle" font-size="13" font-weight="600">Line current</text><text x="700" y="132" text-anchor="middle" font-size="17" font-weight="600" fill="#15803d" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">14.9 A</text><text x="20" y="40" font-size="14" font-weight="600">From nameplate output to current</text><text x="20" y="190" font-size="12" fill="#5a6572">Efficiency 0.9 and power factor 0.85 are examples — use nameplate or catalogue values</text><text x="20" y="212" font-size="12" fill="#5a6572">If the nameplate lists a rated current, that value comes first</text>
</svg>
