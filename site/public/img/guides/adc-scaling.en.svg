<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>Analog input scaling (4–20 mA, 150 Ω, 12-bit 3.3 V, 0–10 bar)</title>
<rect width="780" height="250" rx="10" fill="#fff"/>
<rect x="20" y="70" width="130" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="85" y="100" text-anchor="middle" font-size="13" font-weight="600">Current signal</text><text x="85" y="132" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">4 ~ 20 mA</text><line x1="156" y1="110" x2="215.33333333333331" y2="110" stroke="#1d4ed8" stroke-width="2"/><path d="M208.33333333333331 104 L217.33333333333331 110 L208.33333333333331 116 Z" fill="#1d4ed8"/><text x="186.66666666666666" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">× 150 Ω</text><rect x="223.33333333333331" y="70" width="130" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="288.3333333333333" y="100" text-anchor="middle" font-size="13" font-weight="600">ADC input</text><text x="288.3333333333333" y="132" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">0.6 ~ 3.0 V</text><line x1="359.3333333333333" y1="110" x2="418.66666666666663" y2="110" stroke="#1d4ed8" stroke-width="2"/><path d="M411.66666666666663 104 L420.66666666666663 110 L411.66666666666663 116 Z" fill="#1d4ed8"/><text x="390" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">÷ 0.806 mV</text><rect x="426.66666666666663" y="70" width="130" height="80" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="491.66666666666663" y="100" text-anchor="middle" font-size="13" font-weight="600">ADC code</text><text x="491.66666666666663" y="132" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">745 ~ 3724</text><line x1="562.6666666666666" y1="110" x2="622" y2="110" stroke="#1d4ed8" stroke-width="2"/><path d="M615 104 L624 110 L615 116 Z" fill="#1d4ed8"/><text x="593.3333333333333" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">linear</text><rect x="630" y="70" width="130" height="80" rx="6" fill="#ecf8f0" stroke="#15803d" stroke-width="1.5"/><text x="695" y="100" text-anchor="middle" font-size="13" font-weight="600">Engineering</text><text x="695" y="132" text-anchor="middle" font-size="16" font-weight="600" fill="#15803d" font-family="ui-monospace,Consolas,'Cascadia Mono',Menlo,monospace">0 ~ 10 bar</text><text x="20" y="40" font-size="14" font-weight="600">From signal to engineering units</text><text x="20" y="190" font-size="12" fill="#5a6572">About 2979 codes in use → one count ≈ 0.0034 bar (not all 4096 steps of 12 bits)</text><text x="20" y="212" font-size="12" fill="#5a6572">150 Ω and a 3.3 V reference are an example — the 3.0 V top leaves headroom</text>
</svg>
