 x1="685" y1="385" x2="685" y2="412" stroke="#1d4ed8" stroke-width="2"/><circle cx="685" cy="385" r="3.5" fill="#1d4ed8"/><rect x="640" y="412" width="65" height="30" rx="4" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="672" y="432" text-anchor="middle" font-size="13" font-weight="600">Sn</text><text x="570" y="432" text-anchor="middle" font-size="18" font-weight="600">…</text><line x1="150" y1="365" x2="150" y2="368" stroke="#1f2933" stroke-width="2"/><line x1="150" y1="382" x2="150" y2="385" stroke="#1f2933" stroke-width="2"/><rect x="144" y="368" width="12" height="14" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="745" y1="365" x2="745" y2="368" stroke="#1f2933" stroke-width="2"/><line x1="745" y1="382" x2="745" y2="385" stroke="#1f2933" stroke-width="2"/><rect x="739" y="368" width="12" height="14" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="150" y="350" text-anchor="middle" font-size="12">120 Ω</text><text x="745" y="350" text-anchor="middle" font-size="12">120 Ω</text><text x="450" y="465" text-anchor="middle" font-size="13">Shared pair (half duplex, one talker at a time) · 32 unit loads · up to 1200 m</text>
