<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" font-family="system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f2933">
<title>Burden on a CT secondary (200/5 A, 10 m one way, 2.5 mm²)</title>
<rect width="780" height="350" rx="10" fill="#fff"/>
<line x1="30" y1="80" x2="400" y2="80" stroke="#1f2933" stroke-width="4"/><path d="M391 74 L400 80 L391 86 Z" fill="#1f2933"/><text x="40" y="66" font-size="13" font-weight="600">Primary current</text><ellipse cx="200" cy="80" rx="22" ry="34" fill="none" stroke="#1d4ed8" stroke-width="5"/><text x="240" y="66" font-size="13" font-weight="600" fill="#1d4ed8">CT 200/5 — 200 A primary gives 5 A</text><line x1="186" y1="112" x2="186" y2="130" stroke="#1d4ed8" stroke-width="2"/><line x1="214" y1="112" x2="214" y2="130" stroke="#1d4ed8" stroke-width="2"/><circle cx="186" cy="130" r="3.5" fill="#1d4ed8"/><circle cx="214" cy="130" r="3.5" fill="#1d4ed8"/><text x="178" y="134" text-anchor="end" font-size="12" font-weight="600" fill="#1d4ed8">S1</text><text x="222" y="134" font-size="12" font-weight="600" fill="#1d4ed8">S2</text><path d="M186 130 V170 H560" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M214 130 V250 H560" stroke="#c2410c" stroke-width="2.5" fill="none" stroke-linejoin="round"/><line x1="300" y1="170" x2="340" y2="170" stroke="#c2410c" stroke-width="2"/><line x1="380" y1="170" x2="420" y2="170" stroke="#c2410c" stroke-width="2"/><rect x="340" y="164" width="40" height="12" rx="1" fill="#fff" stroke="#c2410c" stroke-width="2"/><line x1="300" y1="250" x2="340" y2="250" stroke="#c2410c" stroke-width="2"/><line x1="380" y1="250" x2="420" y2="250" stroke="#c2410c" stroke-width="2"/><rect x="340" y="244" width="40" height="12" rx="1" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="360" y="156" text-anchor="middle" font-size="12" fill="#c2410c">10 m one way · 2.5 mm²</text><text x="360" y="274" text-anchor="middle" font-size="12" fill="#c2410c">10 m one way · 2.5 mm²</text><text x="360" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">Round trip 0.138 Ω → 3.45 VA at 5 A</text><circle cx="250" cy="250" r="3.5" fill="#1f2933"/><line x1="250" y1="250" x2="250" y2="272" stroke="#1f2933" stroke-width="2"/><line x1="238" y1="272" x2="262" y2="272" stroke="#1f2933" stroke-width="2"/><line x1="243" y1="277" x2="257" y2="277" stroke="#1f2933" stroke-width="2"/><line x1="247" y1="282" x2="253" y2="282" stroke="#1f2933" stroke-width="2"/><text x="250" y="300" text-anchor="middle" font-size="11" fill="#5a6572">one side grounded</text><rect x="560" y="140" width="180" height="140" rx="6" fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.5"/><text x="650" y="175" text-anchor="middle" font-size="14" font-weight="600">Meter current input</text><text x="650" y="200" text-anchor="middle" font-size="12" fill="#5a6572">1 VA ÷ 5² = 0.04 Ω</text><line x1="650" y1="215" x2="650" y2="226.5" stroke="#1f2933" stroke-width="2"/><line x1="650" y1="256.5" x2="650" y2="268" stroke="#1f2933" stroke-width="2"/><rect x="644" y="226.5" width="12" height="30" rx="1" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="20" y="30" font-size="14" font-weight="600">Burden on the CT = round-trip leads + meter input (+ terminals)</text><text x="760" y="312" text-anchor="end" font-size="13" font-weight="600" fill="#15803d">Total 0.178 Ω × 5² = 4.45 VA → 89 % of a 5 VA rating</text><text x="760" y="334" text-anchor="end" font-size="12" font-weight="600" fill="#b91c1c">Never open the secondary under current — high voltage peaks</text>
</svg>
