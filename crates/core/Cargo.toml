[package]
name = "portdock-core"
description = "PortDock 공용 부품 — 체크섬·변환·프레임 구분·Modbus·자동응답·시리얼 세션"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serialport = "4.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# TCP keepalive 시간 설정(죽은 상대 감지) — 이미 의존성 트리에 있는 판
socket2 = "0.6"
# 송신·표시 글자 인코딩(CP949·Latin-1) — WHATWG 표준 구현
encoding_rs = "0.8"

# 시작 실패(WebView2 없음 등)를 알리는 기본 메시지 상자 — 이미 의존성 트리에 있는 판
[target.'cfg(windows)'.dependencies]
# Win32_Devices_Communication: Mark·Space 패리티·1.5 정지 비트·RS-485 RTS 토글(DCB 직접 설정)
# Win32_NetworkManagement_*·Networking_WinSock: 랜카드 IPv4 목록·포트를 쥔 프로그램(net.rs)
windows-sys = { version = "0.61", features = ["Win32_Devices_Communication", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# 네이티브 크래시(접근 위반 등) — 감시 프로세스가 minidump 를 남긴다. 공식 Sentry SDK 대신 가벼운 부품만
crash-handler = "0.8"
minidumper = "0.11"
# WebView2 화면 프로세스가 죽었을 때(흰 화면) 알아채기 — tauri 가 이미 쓰는 판
webview2-com = "0.39"
windows = { version = "0.62", default-features = false }

[dev-dependencies]
serde_json = "1"
