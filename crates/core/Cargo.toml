[package]
name = "portdock-core"
description = "PortDock 공용 부품 — 체크섬·변환·프레임 구분·Modbus·자동응답·시리얼 세션"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serialport = "4.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# TCP keepalive 시간 설정(죽은 상대 감지) — 이미 의존성 트리에 있는 판
socket2 = "0.6"
# 송신·표시 글자 인코딩(CP949·Latin-1) — WHATWG 표준 구현
encoding_rs = "0.8"

# 시작 실패(WebView2 없음 등)를 알리는 기본 메시지 상자 — 이미 의존성 트리에 있는 판
[target.'cfg(windows)'.dependencies]
# Win32_Devices_Communication: Mark·Space 패리티·1.5 정지 비트·RS-485 RTS 토글(DCB 직접 설정)
# Win32_NetworkManagement_*·Networking_WinSock: 랜카드 IPv4 목록·포트를 쥔 프로그램(net.rs)
# Win32_Devices_DeviceAndDriverInstallation·Properties·System_Registry·EventLog·Power: Port Inspector 읽기(portinfo — 장치 속성·
# Device Parameters·ComDB·PnP 이벤트·USB 선택적 절전). 모두 읽기 권한만 쓴다
# Win32_Devices_Usb·System_IO: Port Inspector USB 경로(portinfo/usb.rs — 허브에 조회 IOCTL 만, FILE_ANY_ACCESS)
# Win32_System_Services: 블루투스 서비스 상태(portinfo/wireless.rs — SC_MANAGER_CONNECT·SERVICE_QUERY_STATUS 조회만)
windows-sys = { version = "0.61", features = ["Win32_Devices_Communication", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_Usb", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_EventLog", "Win32_System_IO", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# 네이티브 크래시(접근 위반 등) — 감시 프로세스가 minidump 를 남긴다. 공식 Sentry SDK 대신 가벼운 부품만
crash-handler = "0.8"
minidumper = "0.11"
# WebView2 화면 프로세스가 죽었을 때(흰 화면) 알아채기 — tauri 가 이미 쓰는 판
webview2-com = "0.39"
# Win32_System_Wmi·Com·Variant·Ole: 장치 «전원 절약을 위해 끌 수 있음»·랜카드 이중 방식·고급 속성을 WMI 로 읽기(portinfo/wmi.rs)
# Win32_NetworkManagement_WindowsFirewall: 방화벽 프로필 켜짐 읽기(INetFwPolicy2, 읽기 속성만)
# Win32_Media_Audio: 기본 소리 장치가 블루투스 핸즈프리 끝점인지(IMMDeviceEnumerator 기본 끝점 ID 만 — 소리를 열지 않는다)
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi"] }

[dev-dependencies]
serde_json = "1"
