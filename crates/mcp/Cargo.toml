[package]
name = "portdock-mcp"
description = "PortDock MCP 서버 — AI 에이전트가 PortDock core 로 포트·장비를 읽는다(stdio, 읽기 전용 + 127.0.0.1 시뮬레이터 쓰기)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "portdock-mcp"
path = "src/main.rs"

[dependencies]
portdock-core = { path = "../core" }
# MCP 공식 Rust SDK(Apache-2.0) — 서버·도구 매크로·stdio 만. HTTP·인증 기능은 켜지 않는다
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
# rmcp 가 쓰는 비동기 실행기 — 실행기·매크로만(core 는 동기라 spawn_blocking 으로 부른다)
tokio = { version = "1", features = ["rt", "macros"] }
# 도구 인자 JSON Schema — rmcp 가 쓰는 판과 같은 1.x
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
